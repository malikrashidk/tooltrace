<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Trace Extension</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-foreground: #ffffff;
      --background: #ffffff;
      --muted: #f1f5f9;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
    }

    body {
      width: 350px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }

    .header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      background: #fff;
      border: none;
      color: var(--muted-foreground);
    }

    .tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    .content {
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .tool-info {
      flex: 1;
    }

    .tool-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .tool-url {
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }

    .btn {
      width: 100%;
      padding: 0.5rem;
      background: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: 0.375rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      box-sizing: border-box;
    }

    .status-message {
      padding: 0.5rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .status-success { background: #dcfce7; color: #166534; }
    .status-error { background: #fee2e2; color: #991b1b; }
    .status-loading { background: #e0f2fe; color: #075985; }

    #pinnedList {
        display: none;
    }

    #addForm {
        display: none;
    }

    .hidden {
        display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>âš¡ï¸ </span> Tool Trace
    </div>
    <div id="authStatus" style="font-size: 0.8rem; color: #64748b;">Checking...</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="detect">Detected</button>
    <button class="tab" data-tab="pinned">Pinned</button>
    <button class="tab" data-tab="add">Add New</button>
  </div>

  <div class="content">
    <div id="statusMessage"></div>

    <div id="matchView" class="hidden" style="margin-bottom: 1rem; border: 1px solid var(--primary); border-radius: 0.5rem; padding: 1rem; background: #eff6ff;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
                <div id="matchName" style="font-weight: 700; font-size: 1rem;">Tool Found</div>
                <div style="font-size: 0.8rem; color: var(--primary);">Saved credentials available</div>
            </div>
            <button id="autofillBtn" class="btn" style="width: auto; padding: 0.5rem 1rem;">âš¡ï¸  Fill Login</button>
        </div>
    </div>

    <div id="detectView">
      <div id="emptyState" style="text-align: center; color: var(--muted-foreground); padding: 2rem;">
        No known SaaS tools detected on current tabs.
      </div>
      <div id="toolsList"></div>
      <button id="addBtn" class="btn" disabled>Add Selected Tools</button>
    </div>

    <div id="pinnedView" class="hidden">
      <div id="pinnedList"></div>
      <div id="pinnedEmpty" style="text-align: center; color: var(--muted-foreground); padding: 2rem; display: none;">
        No pinned tools found. Pin tools in the dashboard for quick access.
      </div>
    </div>

    <div id="addView" class="hidden">
        <form id="manualAddForm">
            <div class="input-group">
                <label>Tool Name</label>
                <input type="text" id="manualName" required placeholder="e.g. Linear">
            </div>
             <div class="input-group">
                <label>Website URL</label>
                <input type="url" id="manualUrl" required placeholder="https://linear.app">
            </div>
             <div class="input-group">
                <label>Username (Optional)</label>
                <input type="text" id="manualUser" placeholder="email@example.com">
            </div>
             <div class="input-group">
                <label>Password (Optional)</label>
                <input type="password" id="manualPass" placeholder="********">
            </div>
            <button type="submit" class="btn">Save Tool</button>
        </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
