<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Hub Tool Detector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      width: 350px;
      background: #ffffff;
      color: #1a1a1a;
    }

    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .container {
      padding: 16px;
    }

    .tools-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tool-item:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    .tool-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
    }

    .tool-info {
      flex: 1;
    }

    .tool-name {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .tool-url {
      font-size: 11px;
      color: #6b7280;
    }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: #6b7280;
    }

    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-primary:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #1a1a1a;
      border: 1px solid #d1d5db;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .status-message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }

    .status-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .status-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .status-loading {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #1e40af;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #f0f9ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #1e40af;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
    }

    .status-dot.disconnected {
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔧 SaaS Hub</h1>
    <p>Auto-detect and add your tools</p>
  </div>

  <div class="container">
    <div class="connection-status" id="connectionStatus">
      <div class="status-dot"></div>
      <span>Connected to SaaS Hub</span>
    </div>

    <div id="toolsList" class="tools-list"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-state-icon">🔍</div>
      <p>No SaaS tools detected on this page</p>
    </div>

    <div id="statusMessage"></div>

    <div class="actions">
      <button class="btn-secondary" onclick="refreshTools()">Refresh</button>
      <button class="btn-primary" id="addBtn" onclick="addSelectedTools()" disabled>Add Selected</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
