<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltrace Hub</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --background: #ffffff;
      --muted: #f8fafc;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --radius: 12px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      color: #0f172a;
      background-color: var(--muted);
      overflow-x: hidden;
    }

    /* Layout */
    .header {
      padding: 1.25rem 1rem;
      background: var(--background);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      color: var(--primary);
    }

    .logo img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
    }

    .auth-status {
      font-size: 0.75rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Tabs */
    .tabs-container {
      background: var(--background);
      padding: 0.25rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
    }

    .tab {
      padding: 0.625rem 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted-foreground);
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .tab:hover {
      color: var(--primary);
    }

    .tab.active {
      color: var(--accent);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Content Area */
    .content {
      padding: 1rem;
      min-height: 260px;
      max-height: 420px;
      overflow-y: auto;
    }

    /* Tool Cards */
    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.875rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.875rem;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .tool-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .tool-checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .tool-icon {
      width: 40px;
      height: 40px;
      background: var(--muted);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .tool-info {
      flex: 1;
      overflow: hidden;
    }

    .tool-name {
      font-weight: 600;
      font-size: 0.9375rem;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-domain {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      margin: 0.125rem 0 0;
    }

    /* Match View (Autofill Promo) */
    .match-banner {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-title {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .match-desc {
      font-size: 0.75rem;
      color: #3b82f6;
      margin: 0.125rem 0 0;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0.625rem 1rem;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      background: var(--border);
      color: var(--muted-foreground);
      cursor: not-allowed;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
    }

    .btn-outline:hover {
      background: #eff6ff;
    }

    .btn-sm {
      padding: 0.4375rem 0.875rem;
      font-size: 0.75rem;
    }

    /* Forms */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      color: var(--primary);
    }

    .form-input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      box-sizing: border-box;
      transition: border-color 0.2s ease, ring 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Status & Empty States */
    .status-msg {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .status-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .status-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .status-info {
      background: #e0f2fe;
      color: #075985;
      border: 1px solid #bae6fd;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--muted-foreground);
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-text {
      font-size: 0.875rem;
      line-height: 1.5;
    }

    /* Footer / Bottom Actions */
    .footer {
      padding: 1rem;
      background: var(--background);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Utils */
    .hidden {
      display: none !important;
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    .spinner-dark {
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--accent);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">
      <img src="icons/icon48.png" alt="Tooltrace">
      <span>Tooltrace</span>
    </div>
    <div id="authStatus" class="auth-status">
      <div class="status-dot" style="background: #cbd5e1;"></div>
      Checking...
    </div>
  </div>

  <div class="tabs-container">
    <div class="tabs">
      <button class="tab active" data-tab="detect">Detected</button>
      <button class="tab" data-tab="pinned">Pinned</button>
      <button class="tab" data-tab="add">Quick Add</button>
    </div>
  </div>

  <div class="content">
    <div id="statusMessage"></div>

    <!-- Credential Found Alert -->
    <div id="matchView" class="match-banner hidden">
      <div class="match-header">
        <div>
          <div id="matchName" class="match-title">Tool Found</div>
          <div id="matchDesc" class="match-desc">Saved credentials ready to use</div>
        </div>
        <button id="autofillBtn" class="btn btn-outline btn-sm">⚡ Fill Login</button>
        <button id="addCredsBtn" class="btn btn-outline btn-sm hidden">➕ Save Login</button>
      </div>
      <!-- Miniature form for adding credentials to existing tool -->
      <div id="quickCredForm" class="hidden"
        style="margin-top: 0.5rem; border-top: 1px solid #bfdbfe; padding-top: 0.5rem;">
        <input type="text" id="quickUser" placeholder="Email/Username" class="form-input"
          style="font-size: 0.75rem; padding: 0.4rem; margin-bottom: 0.4rem;">
        <input type="password" id="quickPass" placeholder="Password" class="form-input"
          style="font-size: 0.75rem; padding: 0.4rem; margin-bottom: 0.4rem;">
        <button id="saveQuickCredBtn" class="btn btn-primary btn-sm" style="width: 100%;">Save Credentials</button>
      </div>
    </div>

    <!-- Detect View -->
    <div id="detectView">
      <div id="toolsList"></div>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">No known tools detected.<br>Visit a SaaS site to see it here.</div>
      </div>
    </div>

    <!-- Pinned View -->
    <div id="pinnedView" class="hidden">
      <div id="pinnedList"></div>
      <div id="pinnedEmpty" class="empty-state">
        <div class="empty-icon">📌</div>
        <div class="empty-text">No pinned tools yet.<br>Pin your favorites in the app.</div>
      </div>
    </div>

    <!-- Manual Add View -->
    <div id="addView" class="hidden">
      <form id="manualAddForm">
        <div class="form-group">
          <label class="form-label">Tool Name</label>
          <input type="text" id="manualName" class="form-input" required placeholder="e.g. Linear">
        </div>
        <div class="form-group">
          <label class="form-label">Website URL</label>
          <input type="url" id="manualUrl" class="form-input" required placeholder="https://linear.app">
        </div>
        <div class="form-group">
          <label class="form-label">Username (Optional)</label>
          <input type="text" id="manualUser" class="form-input" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password (Optional)</label>
          <input type="password" id="manualPass" class="form-input" placeholder="********">
        </div>
        <button type="submit" class="btn btn-primary">Save to Tooltrace</button>
      </form>
    </div>
  </div>

  <div class="footer">
    <button id="addBtn" class="btn btn-primary" disabled>Add Selected Tools</button>
    <div style="text-align: center; font-size: 0.7rem; color: var(--muted-foreground);">
      <a href="https://app.tooltrace.io" target="_blank" style="color: inherit; text-decoration: underline;">Open
        Dashboard</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
